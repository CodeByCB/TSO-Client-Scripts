name: Validate scripts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check user_cb_ChatReconnect.js
